name: Redirect modules.vpavlin.xyz

# This repo is now the Basecamp catalog *build engine* — the storefront moved to
# apps.vpavlin.xyz (vpavlin/logos-apps). Keep modules.vpavlin.xyz alive as a
# redirect so any old links / DNS still land on the storefront.
on:
  push:
    branches: [main]
    paths: [".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Build redirect page
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>vpavlin's Logos — moved to apps.vpavlin.xyz</title>
          <meta http-equiv="refresh" content="0; url=https://apps.vpavlin.xyz/">
          <link rel="canonical" href="https://apps.vpavlin.xyz/">
          <style>body{font:16px/1.6 system-ui,sans-serif;max-width:36rem;margin:20vh auto;padding:0 1rem}</style>
          </head><body>
          <p>This catalog moved to <a href="https://apps.vpavlin.xyz/">apps.vpavlin.xyz</a>.</p>
          </body></html>
          HTML
          echo "modules.vpavlin.xyz" > dist/CNAME
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
